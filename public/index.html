<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#0b101b;color:#e9edf5;font:20px 'Segoe UI',sans-serif}header{height:84px;display:flex;align-items:center;gap:32px;padding:0 46px;background:#111a2a;border-bottom:1px solid #263348}header img{width:172px}header strong{font-size:27px}nav{display:flex;gap:8px;margin-left:auto}button{background:#18253c;color:#cfdbec;border:1px solid #34445b;padding:13px 22px;border-radius:8px;font:inherit;cursor:pointer}button.active,button:hover{background:#2455d9;color:white}main{padding:32px 48px 110px}h1{font-size:38px;margin:0 0 12px}h2{font-size:26px;margin:0 0 20px}.muted{color:#98acc7}.badge{font-size:16px;padding:7px 14px;background:#1c3154;border-radius:6px;color:#9fbcff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:25px 0}.card,.panel{background:#111c2e;border:1px solid #2a3a54;border-radius:12px;padding:25px}.card b{display:block;font-size:39px;margin-top:10px}.blue{color:#759dff}.green{color:#67d7a5}.orange{color:#f5bc60}table{width:100%;border-collapse:collapse;font-size:20px}th,td{text-align:left;padding:18px 13px;border-bottom:1px solid #2a374b}th{color:#91a5c1;font-weight:400}tr:hover{background:#172942}small{font-size:17px}input{font:inherit;background:#0b1424;border:1px solid #465b78;color:white;padding:12px;width:160px;border-radius:6px}input[type=range]{width:100%}pre{white-space:pre-wrap;font:23px/1.7 Consolas,monospace;color:#b8d4b8}code{color:#9bbcff}#chart{width:100%;height:175px}#terminal{background:linear-gradient(#10131bcc,#10131bdd),url('/api-background.png') center/cover;min-height:800px;padding:80px}#terminal .panel{background:#0b111cf5;max-width:1450px;margin:auto;border:2px solid #556781;box-shadow:0 20px 80px #000}.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}.row{display:flex;align-items:center;gap:22px;margin:18px 0}.quote{font-size:49px}.prompt{font:24px/1.65 Consolas;background:#08101f;border:1px solid #35445e;padding:26px;white-space:pre-wrap}label{display:inline-block;margin-right:30px}a{color:#83abff}
.badge,p.muted,header strong,#app>.row>.muted{display:none!important}</style></head><body><header><img src="polymarket.svg"><span class="badge">RESEARCH</span><nav id="nav"></nav></header><main id="app"></main><script>
let study,scan,current='scanner',selected=0;const $=s=>document.querySelector(s),money=x=>'$'+Number(x).toFixed(2),pc=x=>(x*100).toFixed(2)+'%',esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;');
const tabs=['Scanner','Opportunity','History','Replay','Capacity','Setup','Terminal'];
function nav(){ $('#nav').innerHTML=tabs.map(t=>`<button data-tab="${t.toLowerCase()}" class="${current===t.toLowerCase()?'active':''}">${t}</button>`).join('');$('#nav').onclick=e=>{if(e.target.dataset.tab)go(e.target.dataset.tab)}}
function cards(items){return '<div class="grid">'+items.map(([k,v,c])=>`<div class="card"><span class="muted">${k}</span><b class="${c||''}">${v}</b></div>`).join('')+'</div>'}
function go(t){current=t;nav();const a=$('#app');const rows=scan.data||[];
if(t==='scanner'){a.innerHTML='<h1>Qualified opportunity scanner</h1><div class="row"><span class="badge">100 CONTRACTS</span><span class="muted">Saved API assessment · '+(scan.meta?.asOf||'')+'</span><button id="refresh">Refresh live</button></div>'+cards([['Returned pairs',rows.length,'blue'],['Requested contracts','100'],['Recorded orders','0'],['Source','Predictefy']])+`<section class="panel"><table><thead><tr><th>Market</th><th>YES / NO</th><th>Total cost</th><th>Payout</th><th>Estimated surplus</th></tr></thead><tbody>${rows.map((r,i)=>`<tr data-row="${i}"><td>${esc(r.question)}</td><td>${r.legs.buyYes.venue} / ${r.legs.buyNo.venue}</td><td>${money(r.totalCost)}</td><td>${money(r.payout)}</td><td class="green">${money(r.netEdge)}</td></tr>`).join('')}</tbody></table></section>`;$('#refresh').onclick=async()=>{const button=$('#refresh');button.disabled=true;button.textContent='Refreshing...';try{const response=await fetch('/api/scan');const next=await response.json();if(!response.ok||next.success===false||!Array.isArray(next.data))throw new Error(next.error||'No valid scan data returned');scan=next;go('scanner')}catch(error){button.disabled=false;button.textContent='Refresh live';let message=$('#scan-error');if(!message){message=document.createElement('p');message.id='scan-error';message.style.color='#f5bc60';button.parentElement.after(message)}message.textContent=error.message}};a.querySelectorAll('[data-row]').forEach(e=>e.onclick=()=>{selected=+e.dataset.row;go('opportunity')});}
if(t==='opportunity'){const r=rows[selected]||rows[0];a.innerHTML='<h1>'+esc(r.question)+'</h1><p class="muted">Dated opportunity snapshot · conditional settlement payout</p>'+cards([['Acquisition cost',money(r.totalCost)],['Conditional payout',money(r.payout)],['Estimated surplus',money(r.netEdge),'green'],['Estimated ROI',pc(r.roi),'blue']])+`<div class="cols">${Object.entries(r.legs).map(([key,l])=>`<section class="panel"><h2>${key==='buyYes'?'Buy YES':'Buy NO'} · ${l.venue}</h2><div class="quote blue">${(l.vwap*100).toFixed(3)}¢</div><table><tr><td>Walked cost</td><td>${money(l.cost)}</td></tr><tr><td>Fee</td><td>${money(l.fee)}</td></tr><tr><td>Filled-size assessment</td><td>${l.filled} / ${r.contracts}</td></tr><tr><td>Best-level size</td><td>${l.sizeAtPrice}</td></tr><tr><td>Book observed</td><td><small>${l.asOf}</small></td></tr></table></section>`).join('')}</div><div class="panel row"><b>Resolution: ${r.resolutionEquivalence}</b><span>Network cost ${money(r.networkFee)}</span><span class="muted">Assessed ${r.assessedAt}</span></div>`;}
if(t==='history'||t==='replay'){a.innerHTML='<h1>Republican House control · historical price study</h1><p class="muted">Polymarket YES + Kalshi NO · hourly trade-derived closes</p>'+cards([['Matched observations',939],['Earlier > 1 cent / total','368 / 704'],['Later > 1 cent / total','45 / 235'],['Fill-based P&L','Not established','orange']])+`<section class="panel"><svg id="chart" viewBox="0 0 1600 300"></svg><div class="row"><span class="blue">Polymarket YES</span><span class="green">Kalshi NO</span><span class="orange">Close-price spread</span></div><input id="slider" type="range" min="0" max="938" value="${window.replayIndex||0}"><div id="observation"></div></section><section class="panel" style="margin-top:24px"><table><tr><th>Period</th><th>Observations</th><th>Spread &gt; 1¢</th><th>Average spread</th></tr>${['development','holdout'].map(k=>`<tr><td>${k==='holdout'?'Later chronological test':'Earlier development'}</td><td>${study[k].rows}</td><td>${study[k].above1pct}</td><td>${(study[k].meanEdge*100).toFixed(3)}¢</td></tr>`).join('')}</table></section>`;draw();$('#slider').oninput=e=>select(+e.target.value);select(window.replayIndex||0);}
if(t==='capacity'){a.innerHTML='<h1>What would $500 per day require?</h1><p class="muted">Scenario worksheet · not a performance forecast</p><section class="panel"><div class="row"><label>Daily objective<br><input id="target" type="number" value="500"></label><label>Net surplus / package<br><input id="profit" type="number" value="1" step=".1"></label><label>Cost / package<br><input id="cost" type="number" value="99"></label></div><div id="calculation"></div></section>';function calc(){let t=+$('#target').value,p=+$('#profit').value,c=+$('#cost').value;$('#calculation').innerHTML=cards([['Completed packages',p>0?Math.ceil(t/p):'—','blue'],['Acquisition cost',p>0?money(Math.ceil(t/p)*c):'—'],['Turnover assumption','1 full cycle'],['Holding time','Must measure','orange']])}a.oninput=calc;calc();}
if(t==='setup'){a.innerHTML='<h1>Build prompt & Python setup</h1><div class="row"><img src="predictefy.svg" style="width:220px"><span class="badge">Build prompt</span></div><div id="prompt" class="prompt"></div><div class="row"><button id="copy">Copy build prompt</button><span class="muted">Prompt placement only · unsubmitted</span></div><section class="panel"><pre>python server.py\nhttp://127.0.0.1:8862\n\nPREDICTEFY_API_KEY is read locally.</pre></section>';fetch('/build-prompt.txt').then(x=>x.text()).then(x=>$('#prompt').textContent=x);$('#copy').onclick=()=>{ $('#copy').textContent='Prompt selected';window.getSelection().selectAllChildren($('#prompt'))};}
if(t==='terminal'){a.innerHTML='<div id="terminal"><section class="panel"><h2>Python · research verification</h2><pre id="output">Running analysis…</pre></section></div>';fetch('/api/terminal').then(x=>x.text()).then(x=>$('#output').textContent=x);}
window.scrollTo(0,0);}
function draw(){const n=study.pairs.length,points=(key,scale=1)=>study.pairs.map((r,i)=>`${i/(n-1)*1560+20},${280-r[key]?.close*250}`).join(' ');const edge=study.pairs.map((r,i)=>`${i/(n-1)*1560+20},${220-r.edge*1600}`).join(' ');$('#chart').innerHTML=`<text x="20" y="20" fill="#91a5c1" font-size="19">YES / NO close prices (0?1)</text><text x="1260" y="20" fill="#f5bc60" font-size="19">Spread (separate cent scale)</text><line x1="20" y1="220" x2="1580" y2="220" stroke="#46536a"/><polyline points="${points('polymarketYes')}" fill="none" stroke="#759dff" stroke-width="2"/><polyline points="${points('kalshiNo')}" fill="none" stroke="#67d7a5" stroke-width="2"/><polyline points="${edge}" fill="none" stroke="#f5bc60" stroke-width="2"/><line id="cursor" x1="20" y1="0" x2="20" y2="300" stroke="white" stroke-dasharray="5 5"/>`;}
function select(i){window.replayIndex=i;$('#slider').value=i;let r=study.pairs[i];$('#cursor').setAttribute('x1',20+i/938*1560);$('#cursor').setAttribute('x2',20+i/938*1560);$('#observation').innerHTML=`<table><tr><th>Timestamp UTC</th><th>Polymarket YES close</th><th>Kalshi NO close</th><th>Close-price spread</th><th>&gt; 1¢ screen</th></tr><tr><td>${new Date(r.timestamp).toISOString().slice(0,16)}</td><td>${r.polymarketYes.close.toFixed(3)}</td><td>${r.kalshiNo.close.toFixed(3)}</td><td class="orange">${(r.edge*100).toFixed(2)}¢</td><td>${r.edge>.01?'PASS':'REJECT'}</td></tr></table>`;}
Promise.all([fetch('/study.json').then(r=>r.json()),fetch('/scan.json').then(r=>r.json())]).then(([s,c])=>{study=s;scan=c;go('scanner');window.lab={go,select,study,scan};});
</script></body></html>
